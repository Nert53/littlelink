<!DOCTYPE html>

<!-- 
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
        
    <title>Vojtěch Netrh</title>
    <link rel="icon" type="image/x-icon" href="/images/avatar.webp">
  
    <meta name="description" content="Links for Vojtěch Netrh's mobile apps.">
    
    <meta name="keywords" content="vojtech netrh, swimming, programming, computer science">
    
    <meta rel="canonical" href="https://links.vojtech-netrh.cz">
    
    <meta name="author" content="Vojtěch Netrh">
    
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">
  </head>

<body>

    <div class="container">
        <div class="column">

            <!-- 
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/avatar.webp" srcset="images/avatar@2x.webp 2x" alt="LittleLink">

            <h1>
              <div>Vojtěch Netrh</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>I'm computer science student and swimmer in Victoria 🦉.</p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

              <!-- Aqua points iOS -->
              <a class="button button-appstore" href="apps.apple.com/cz/app/aqua-points-calculator/id6736572544" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/apple.svg" alt="Apple Logo">Aqua Points</a>
             
              <!-- Swim Time iOS -->
              <a class="button button-appstore" href="apps.apple.com/cz/app/swim-time-calculator/id6670363039" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/apple.svg" alt="Apple Logo">Swim Time</a>

              <!-- Aqua points Android -->
              <a class="button button-playstore" href="play.google.com/store/apps/details?id=cz.umimplavat.aqua_points_calculator&amp;pcampaignid=web_share" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/google-play.svg" alt="Google Play Store Logo">Aqua Points</a>
             
              <!-- Swim Time Android -->
              <a class="button button-playstore" href="play.google.com/store/apps/details?id=cz.umimplavat.swim_pace_calculator&amp;pcampaignid=web_share" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/google-play.svg" alt="Google Play Store Logo">Swim Time</a>
              
              <!-- GitHub -->
              <a class="button button-github" href="play.google.com/store/apps/details?id=cz.umimplavat.swim_pace_calculator&amp;pcampaignid=web_share" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/github.svg" alt="GitHub logo">Portfolio</a>
              
              <!-- Linkedin -->
              <a class="button button-linked" href="play.google.com/store/apps/details?id=cz.umimplavat.swim_pace_calculator&amp;pcampaignid=web_share" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/linkedin.svg" alt="Linkedin logo">Curriculum vitae</a>
      </div>
        
      <footer>
        Created using <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>.
